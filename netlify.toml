[build]
  # Directory with the package.json and build scripts
  base = "client"

  # Build command
  command = "npm run build"

  # Next.js runtime output -- @netlify/plugin-nextjs manages the publish dir itself.
  publish = ".next"

# Environment variables for the build
[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Canonicalize on the apex domain: julesmpano.org
[[redirects]]
  from = "https://julesmpano.netlify.app/*"
  to = "https://julesmpano.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.julesmpano.org/*"
  to = "https://julesmpano.org/:splat"
  status = 301
  force = true

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
